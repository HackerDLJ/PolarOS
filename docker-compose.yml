services:
  api:
    build: ./backend
    ports: ["8787:8787"]
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: polarscience
      POSTGRES_USER: polaros
      POSTGRES_PASSWORD: polaros_dev
    ports: ["5432:5432"]
    volumes: ["polaros_pg:/var/lib/postgresql/data","./database/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro"]
  java-ingestion:
    image: eclipse-temurin:21-jdk
    working_dir: /app
    ports: ["9090:9090"]
    volumes: ["./java-service:/app"]
    command: sh -c "mkdir -p out && javac -d out src/main/java/com/polaros/IngestionServer.java && java -cp out com.polaros.IngestionServer"
volumes:
  polaros_pg:
